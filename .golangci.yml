version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - nilerr
    - nolintlint
    - unconvert
    - unparam
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 20
    nolintlint:
      require-explanation: true
      require-specific: true
